<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Join a study group</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { --bg: #fffaf5; --fg: #1d1a17; --muted: #6b625a; --accent: #ff8a3d; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171412; --fg: #f4ede6; --muted: #a59a90; --card: #221e1b; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 420px; margin: 16px; padding: 28px; border-radius: 18px; background: var(--card); box-shadow: 0 8px 30px rgb(0 0 0 / 0.08); }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a.button { display: block; text-align: center; padding: 14px; border-radius: 12px; background: var(--accent); color: #fff;
             font-weight: 600; text-decoration: none; min-height: 44px; box-sizing: border-box; }
  .bad { color: #c0392b; }
</style>
</head>
<body>
<main>
  <h1>Join a study group in Trove</h1>
  <p id="say">A friend invited you to practise together. Open the invite in the Trove app on your iPhone, iPad or Mac.</p>
  <a class="button" id="open" href="#">Open in Trove</a>
</main>
<script>
  // The invite (group, invite secret and the group key) is in this page's fragment, which browsers never send to
  // the server. It's handed to the app as it is; nothing is stored or sent from here (PROTOCOL.md §4 "Study groups").
  const fragment = location.hash.slice(1);
  const open = document.getElementById("open");
  if (!/(^|&)g=/.test(fragment) || !/(^|&)k=/.test(fragment)) {
    document.getElementById("say").textContent = "This invite link is incomplete. Ask your friend to send it again.";
    document.getElementById("say").className = "bad";
    open.remove();
  } else {
    open.href = "trove://join#" + fragment + "&r=" + encodeURIComponent(location.origin);
  }
</script>
</body>
</html>
