<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Trove</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div id="app" class="loading" aria-busy="true"></div>

<template id="setup-view">
  <main class="setup">
    <div class="setup-card">
      <img src="/icon.svg" alt="" width="56" height="56">
      <h1>Welcome to Trove</h1>
      <p class="lead">Save anything, find it by meaning. End-to-end encrypted: only your devices can read it.</p>
      <div class="segmented wide" role="tablist" aria-label="How to start">
        <button type="button" role="tab" data-tab="create" aria-pressed="true">New vault</button>
        <button type="button" role="tab" data-tab="join" aria-pressed="false">Setup code</button>
        <button type="button" role="tab" data-tab="recover" aria-pressed="false">Recover</button>
      </div>

      <form id="create-form" data-panel="create">
        <p class="hint">Start a new vault with this browser as its first device. You'll get a recovery code to keep safe.</p>
        <label for="create-name">Name this browser</label>
        <input id="create-name" required maxlength="60">
        <button type="submit" class="primary">Create my vault</button>
        <p class="error" role="alert" hidden></p>
      </form>

      <form id="setup-form" data-panel="join" hidden>
        <p class="hint">On a device that already has Trove: <b>Add a device</b> (in Settings → Devices, or in the web app's sidebar), then copy the setup code. Codes work once and expire after a few minutes.</p>
        <label for="setup-code">Setup code</label>
        <textarea id="setup-code" rows="4" required autocomplete="off" spellcheck="false" placeholder="eyJ2IjoxLC…"></textarea>
        <label for="device-name">Name this browser</label>
        <input id="device-name" required maxlength="60">
        <button type="submit" class="primary">Connect</button>
        <p class="error" role="alert" hidden></p>
      </form>

      <form id="recover-form" data-panel="recover" hidden>
        <p class="hint">Lost every device? Paste the recovery code you saved when you made the vault.</p>
        <label for="recover-code">Recovery code</label>
        <textarea id="recover-code" rows="4" required autocomplete="off" spellcheck="false"></textarea>
        <label for="recover-name">Name this browser</label>
        <input id="recover-name" required maxlength="60">
        <button type="submit" class="primary">Recover my vault</button>
        <p class="error" role="alert" hidden></p>
      </form>
      <p class="fine">This browser keeps your keys locked in its own storage. You can remove it any time from the sidebar here or from Settings → Devices in the app.</p>
    </div>
  </main>
</template>

<template id="recovery-view">
  <main class="setup">
    <div class="setup-card">
      <h1>Save your recovery code</h1>
      <p class="lead">It's the only way back into your vault if you lose this browser, and you'll need it to add your phone or another computer. Keep it in a password manager. Anyone with it can read your vault.</p>
      <textarea id="recovery-code" class="code" rows="6" readonly aria-label="Recovery code"></textarea>
      <div class="row">
        <button id="copy-recovery" type="button" class="secondary">Copy</button>
        <button id="download-recovery" type="button" class="secondary">Download as a file</button>
      </div>
      <label class="check"><input id="saved-it" type="checkbox"> I've saved it somewhere safe</label>
      <button id="recovery-done" type="button" class="primary" disabled>Open my vault</button>
    </div>
  </main>
</template>

<template id="devices-view">
  <div class="dialog-backdrop">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="devices-title">
      <div class="dialog-head"><h2 id="devices-title">Devices &amp; extension</h2><button type="button" class="icon-button" data-close aria-label="Close">✕</button></div>
      <section>
        <h3 class="section-title">Add a phone, tablet or computer</h3>
        <p class="hint">Paste your recovery code to make a single-use setup code (valid 10 minutes). Use it on the new device's “Setup code” tab here, or in the Trove app.</p>
        <textarea id="add-recovery" rows="3" autocomplete="off" spellcheck="false" placeholder="Recovery code" aria-label="Recovery code"></textarea>
        <button id="make-setup" type="button" class="primary">Make a setup code</button>
        <p class="error" role="alert" hidden></p>
        <div id="setup-out" hidden><textarea class="code" rows="4" readonly aria-label="Setup code"></textarea><button type="button" class="secondary" data-copy>Copy setup code</button></div>
      </section>
      <section>
        <h3 class="section-title">Chrome extension</h3>
        <p class="hint">In the extension's options, paste this code. It can add to your vault but never read it.</p>
        <textarea id="extension-code" class="code" rows="3" readonly aria-label="Extension setup code"></textarea>
        <button type="button" class="secondary" data-copy-ext>Copy extension code</button>
      </section>
      <section>
        <h3 class="section-title">Save from your iPhone's share sheet</h3>
        <p class="hint">Make a Shortcut: <b>Receive</b> URLs and text from the Share Sheet → <b>Open URL</b> <code id="share-url"></code><b>[Shortcut Input]</b>. Open it in the same browser you use Trove in.</p>
      </section>
      <section>
        <h3 class="section-title">This browser</h3>
        <ul id="device-list" class="device-list"></ul>
      </section>
    </div>
  </div>
</template>

<template id="main-view">
  <div class="shell">
    <aside class="sidebar" aria-label="Library">
      <div class="brand"><img src="/icon.svg" alt="" width="28" height="28"><span>Trove</span></div>
      <nav id="smart-list"></nav>
      <h2 class="side-heading">Collections</h2>
      <nav id="collection-list"></nav>
      <div class="side-footer">
        <div id="sync-status" class="sync-status" role="status"><span class="dot"></span><span class="label">Connecting…</span></div>
        <button id="sync-now" type="button" class="link-button">Sync now</button>
        <button id="devices" type="button" class="link-button">Devices &amp; extension</button>
        <button id="forget" type="button" class="link-button danger">Remove this browser</button>
      </div>
    </aside>
    <div class="main">
      <header class="toolbar">
        <button id="menu" type="button" class="icon-button only-narrow" aria-label="Show library">☰</button>
        <label class="search">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search, or try tag:food is:pinned type:note" aria-label="Search">
        </label>
        <button id="new-note" type="button" class="primary">New note</button>
      </header>
      <form id="capture" class="capture">
        <input id="capture-input" placeholder="Paste a link or jot something down, then press Enter" aria-label="Quick capture" autocomplete="off">
        <label class="upload-button">Upload<input id="upload" type="file" multiple hidden></label>
      </form>
      <div id="heading" class="heading"></div>
      <div id="grid" class="grid" aria-live="polite"></div>
      <p id="empty" class="empty" hidden>Nothing here yet.</p>
    </div>
    <section id="detail" class="detail" hidden aria-label="Item"></section>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="other-tab" class="other-tab" hidden>
    <div><p>Trove is open in another tab.</p><button id="use-here" type="button" class="primary">Use it here</button></div>
  </div>
</template>
</body>
</html>
