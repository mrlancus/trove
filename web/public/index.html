<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Trove</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#ff8a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trove">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div id="app" class="loading" aria-busy="true"></div>

<template id="setup-view">
  <main class="setup">
    <div class="setup-card">
      <img src="/icon.svg" alt="" width="56" height="56">
      <h1>Welcome to Trove</h1>
      <p class="lead">Save anything, find it by meaning. End-to-end encrypted: only your devices can read it.</p>
      <div class="segmented wide" role="tablist" aria-label="How to start">
        <button type="button" role="tab" data-tab="create" aria-pressed="true">New vault</button>
        <button type="button" role="tab" data-tab="join" aria-pressed="false">Setup code</button>
        <button type="button" role="tab" data-tab="recover" aria-pressed="false">Recover</button>
      </div>

      <form id="create-form" data-panel="create">
        <p class="hint">Start a new vault with this browser as its first device. You'll get a recovery code to keep safe.</p>
        <label for="create-name">Name this browser</label>
        <input id="create-name" required maxlength="60">
        <button type="submit" class="primary">Create my vault</button>
        <p class="error" role="alert" hidden></p>
      </form>

      <form id="setup-form" data-panel="join" hidden>
        <p class="hint">In the Trove app: <b>Settings → Devices &amp; Web → Make a setup code</b> (on iPhone and iPad it's under <b>Trove on the web</b>). It's copied for you, so just paste it here. In another browser with Trove: <b>Devices &amp; extension</b>. Codes work once, for 10 minutes.</p>
        <label for="setup-code">Setup code</label>
        <textarea id="setup-code" rows="4" required autocomplete="off" spellcheck="false" placeholder="eyJ2IjoxLC…"></textarea>
        <label for="device-name">Name this browser</label>
        <input id="device-name" required maxlength="60">
        <button type="submit" class="primary">Connect</button>
        <p class="error" role="alert" hidden></p>
      </form>

      <form id="recover-form" data-panel="recover" hidden>
        <p class="hint">Lost every device? Paste the recovery code you saved when you made the vault.</p>
        <label for="recover-code">Recovery code</label>
        <textarea id="recover-code" rows="4" required autocomplete="off" spellcheck="false"></textarea>
        <label for="recover-name">Name this browser</label>
        <input id="recover-name" required maxlength="60">
        <button type="submit" class="primary">Recover my vault</button>
        <p class="error" role="alert" hidden></p>
      </form>
      <p class="fine">This browser keeps your keys locked in its own storage. You can remove it any time from the sidebar here or from Settings → Devices in the app.</p>
    </div>
  </main>
</template>

<template id="recovery-view">
  <main class="setup">
    <div class="setup-card">
      <h1>Save your recovery code</h1>
      <p class="lead">It's the only way back into your vault if you lose this browser, and you'll need it to add your phone or another computer. Keep it in a password manager. Anyone with it can read your vault.</p>
      <textarea id="recovery-code" class="code" rows="6" readonly aria-label="Recovery code"></textarea>
      <div class="row">
        <button id="copy-recovery" type="button" class="secondary">Copy</button>
        <button id="download-recovery" type="button" class="secondary">Download as a file</button>
      </div>
      <label class="check"><input id="saved-it" type="checkbox"> I've saved it somewhere safe</label>
      <button id="recovery-done" type="button" class="primary" disabled>Open my vault</button>
    </div>
  </main>
</template>

<template id="devices-view">
  <div class="dialog-backdrop">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="devices-title">
      <div class="dialog-head"><h2 id="devices-title">Devices &amp; extension</h2><button type="button" class="icon-button" data-close aria-label="Close"><span data-icon="close"></span></button></div>
      <section>
        <h3 class="section-title">Add a phone, tablet or computer</h3>
        <p class="hint">Paste your recovery code to make a single-use setup code (valid 10 minutes). Use it on the new device's “Setup code” tab here, or in the Trove app.</p>
        <textarea id="add-recovery" rows="3" autocomplete="off" spellcheck="false" placeholder="Recovery code" aria-label="Recovery code"></textarea>
        <button id="make-setup" type="button" class="primary">Make a setup code</button>
        <p class="error" role="alert" hidden></p>
        <div id="setup-out" hidden><textarea class="code" rows="4" readonly aria-label="Setup code"></textarea><button type="button" class="secondary" data-copy>Copy setup code</button></div>
      </section>
      <section>
        <h3 class="section-title">Chrome extension</h3>
        <p class="hint">In the extension's options, paste this code. It can add to your vault but never read it.</p>
        <textarea id="extension-code" class="code" rows="3" readonly aria-label="Extension setup code"></textarea>
        <button type="button" class="secondary" data-copy-ext>Copy extension code</button>
      </section>
      <section>
        <h3 class="section-title">Save from your iPhone's share sheet</h3>
        <p class="hint">Make a Shortcut: <b>Receive</b> URLs and text from the Share Sheet → <b>Open URL</b> <code id="share-url"></code><b>[Shortcut Input]</b>. Open it in the same browser you use Trove in.</p>
      </section>
      <section>
        <h3 class="section-title">This browser</h3>
        <ul id="device-list" class="device-list"></ul>
      </section>
    </div>
  </div>
</template>

<template id="main-view">
  <div class="shell">
    <aside class="sidebar" aria-label="Library">
      <div class="brand"><img src="/icon.svg" alt="" width="28" height="28"><span>Trove</span></div>
      <nav id="smart-list"></nav>
      <h2 class="side-heading with-action" id="folders-heading">Folders <button id="new-folder" type="button" class="side-add" aria-label="New folder" title="New folder">+</button></h2>
      <nav id="folder-list" aria-label="Folders"></nav>
      <h2 class="side-heading" id="collection-heading">Collections</h2>
      <nav id="collection-list"></nav>
      <h2 class="side-heading" id="source-heading">Sources</h2>
      <nav id="source-list" aria-label="Sources"></nav>
      <div class="side-footer">
        <div id="sync-status" class="sync-status" role="status"><span class="dot"></span><span class="label">Connecting…</span></div>
        <button id="sync-now" type="button" class="link-button">Sync now</button>
        <button id="devices" type="button" class="link-button">Devices &amp; extension</button>
        <button id="bridges" type="button" class="link-button">Bridges</button>
        <button id="forget" type="button" class="link-button danger">Remove this browser</button>
      </div>
    </aside>
    <div class="main">
      <header class="toolbar">
        <button id="menu" type="button" class="icon-button only-narrow" aria-label="Show library"><span data-icon="menu"></span></button>
        <label class="search">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search, or try tag:food is:pinned type:note" aria-label="Search">
        </label>
        <button id="select-mode" type="button" class="secondary" title="Select several (or ⌘/Ctrl-click a card)">Select</button>
        <button id="new-sketch" type="button" class="secondary" title="New sketch: draw with a pen, finger, mouse or trackpad"><span data-icon="pencil"></span> Sketch</button>
        <button id="new-note" type="button" class="primary">New note</button>
      </header>
      <form id="capture" class="capture">
        <input id="capture-input" placeholder="Paste a link or jot something down, then press Enter" aria-label="Quick capture" autocomplete="off">
        <label class="upload-button">Upload<input id="upload" type="file" multiple hidden></label>
      </form>
      <div id="heading" class="heading"></div>
      <div id="folder-tiles" class="folder-tiles" hidden></div>
      <div id="grid" class="grid" aria-live="polite"></div>
      <section id="graph-view" class="graph-view" hidden aria-labelledby="graph-title">
        <div class="graph-head"><h1 id="graph-title" class="heading">Connections</h1><span id="graph-count" class="saved"></span></div>
        <div id="graph-tools" class="graph-tools"></div>
        <div id="graph-stage" class="graph-stage"></div>
        <p class="fine">Drag to move around, scroll or pinch to zoom, click a point to open it. Colours are your top folders.</p>
      </section>
      <p id="empty" class="empty" hidden>Nothing here yet.</p>
      <section id="import-view" class="import-view" hidden aria-labelledby="import-title">
        <h1 id="import-title">Bring everything in</h1>
        <p class="lead">Drop files, folders or whole exports. Zips are opened for you, and everything is encrypted before it leaves this browser.</p>
        <div id="dropzone" class="dropzone">
          <div class="dz-idle">
            <svg class="dz-icon" aria-hidden="true" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="url(#dz-grad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <defs><linearGradient id="dz-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9f43"/><stop offset="1" stop-color="#ff4f8b"/></linearGradient></defs>
              <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 15v3a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3"/>
            </svg>
            <p class="dz-title">Drop anything here</p>
            <p class="hint">or</p>
            <div class="row center">
              <label class="primary">Choose files<input id="import-files" type="file" multiple hidden></label>
              <label class="secondary">Choose a folder<input id="import-folder" type="file" webkitdirectory hidden></label>
            </div>
          </div>
          <div class="dz-progress" hidden>
            <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52"/><circle class="bar" cx="60" cy="60" r="52"/></svg>
              <div class="ring-label"><b class="dz-added">0</b><span>added</span></div></div>
            <p class="dz-current hint"></p>
            <p class="dz-count fine"></p>
            <ul class="arrivals" aria-live="polite"></ul>
          </div>
          <div class="dz-done" hidden>
            <div class="mark-wrap" aria-hidden="true"><div class="burst"></div><div class="done-mark"><span data-icon="check"></span></div></div>
            <p class="dz-title dz-summary"></p>
            <ul class="arrivals"></ul>
            <div class="row center"><button type="button" class="primary" id="import-show">Show them</button><button type="button" class="secondary" id="import-more">Import more</button></div>
          </div>
        </div>
        <ul class="formats">
          <li>Zip archives</li><li>Notion &amp; Obsidian exports</li><li>Browser bookmarks</li><li>Kindle highlights</li>
          <li>Pocket &amp; Raindrop CSV</li><li>Readwise</li><li>PDFs &amp; documents</li><li>Photos &amp; screenshots</li><li>Whole folders</li>
        </ul>
        <p class="fine center">You can also drop things anywhere on this page.</p>
        <div class="import-card" id="paste-import">
          <div class="import-card-head"><span data-icon="clipboard"></span><div><strong>Everything from Paste</strong>
            <p class="hint">Your whole Paste history and pinboards go into Trove's clipboard, with when each was copied and the app it came from. Pinboards become tags.</p></div></div>
          <ol class="hint import-steps">
            <li>Easiest: in the Trove Mac app, Import → <strong>Import from Paste</strong> finds it for you. Here: in the file picker press <kbd>⌘</kbd><kbd>⇧</kbd><kbd>G</kbd> and paste
              <code>~/Library/Application Support/com.wiheads.paste-direct</code> (Paste from its website) or
              <code>~/Library/Containers/com.wiheads.paste/Data/Library/Application Support/Paste</code> (App Store).</li>
            <li>Pick <code>db.sqlite</code>, and <code>db.sqlite-wal</code> too if it's there (it holds your newest copies). Older Paste: <code>Paste.db</code>.</li>
          </ol>
          <div class="row"><label class="primary">Choose Paste's files<input id="paste-files" type="file" multiple hidden></label><span class="hint paste-status" aria-live="polite"></span></div>
          <p class="fine">Read in this browser only; nothing is uploaded except your encrypted clips. Passwords and codes are left out.</p>
        </div>
      </section>
      <div id="bulk-bar" class="bulk-bar" role="toolbar" aria-label="Selected items" hidden></div>
    </div>
    <section id="detail" class="detail" hidden aria-label="Item"></section>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="drop-overlay" class="drop-overlay" hidden aria-hidden="true">
    <div><div class="drop-arrow"><span data-icon="arrowDown"></span></div><p class="dz-title">Drop to add to Trove</p><p class="hint">Files, folders, zips, links or text</p></div>
  </div>
  <div id="other-tab" class="other-tab" hidden>
    <div><p>Trove is open in another tab.</p><button id="use-here" type="button" class="primary">Use it here</button></div>
  </div>
</template>
</body>
</html>
