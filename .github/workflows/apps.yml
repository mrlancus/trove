# Builds the Mac and iPhone/iPad apps on GitHub's Macs (free for public repos), since there's no
# Apple Silicon Mac to run Xcode on. Download the apps from the run's Artifacts:
#   Trove-macOS  → unzip, then right-click Trove.app → Open (it isn't notarized)
#   Trove-iOS    → Trove.ipa; install with Sideloadly using your free Apple ID (redo every 7 days)
# Successful builds of main are also published as the "latest" release, with stable links:
#   https://github.com/mrlancus/trove/releases/download/latest/Trove.ipa
#   https://github.com/mrlancus/trove/releases/download/latest/Trove-macOS.zip
#   https://github.com/mrlancus/trove/releases/download/latest/update.json     (Mac self-updates)
#   https://github.com/mrlancus/trove/releases/download/latest/sidestore.json  (SideStore source)
name: Apple apps

on:
  push:
    branches: [main]
    paths: ["App/**", "Packages/**", "extensions/browser/**", "scripts/ci-build-apps.sh", ".github/workflows/apps.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Pick the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -E "macosx|iphoneos"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: TroveCore tests
        run: |
          # On failure, show the compiler's errors (they come long before the end of the log) and keep
          # the whole log on the ci-logs branch as core-test.log.
          mkdir -p build/logs
          if ! (cd Packages/TroveCore && swift test > ../../build/logs/core-test.log 2>&1); then
            grep -E -B2 -A8 "error:|✘|recorded an issue" build/logs/core-test.log | head -200
            grep -E "error:|✘" build/logs/core-test.log | head -60 > build/logs/core-errors.txt
            tail -20 build/logs/core-test.log
            exit 1
          fi
          tail -15 build/logs/core-test.log

      - name: Build apps
        id: build
        env:
          # Optional (see NOTES.md → Mac updates). Without them the Mac app is ad-hoc signed and
          # doesn't get an update feed.
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: ./scripts/ci-build-apps.sh

      - name: Error report
        if: always()
        run: |
          {
            echo "## Build errors"
            for p in macos ios; do
              echo "### $p"; echo '```'; head -150 build/logs/$p-errors.txt 2>/dev/null || echo "(no log)"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # The logs also go to the ci-logs branch, so a cloud Claude session can read them with git.
      - name: Publish logs to the ci-logs branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/ci && mkdir -p /tmp/ci && cp -R build/logs/. /tmp/ci/ 2>/dev/null || true
          echo "${{ github.sha }} ${{ steps.build.outcome }}" > /tmp/ci/RESULT
          cd /tmp/ci
          git init -q && git checkout -qb ci-logs
          git -c user.name=github-actions -c user.email=actions@github.com add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Logs for ${{ github.sha }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:ci-logs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Trove-macOS
          path: build/out/Trove-macOS.zip
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Trove-iOS
          path: build/out/Trove.ipa
          if-no-files-found: ignore

      - name: Publish the "latest" release
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/out/* \
            --prerelease --target "${{ github.sha }}" --title "Latest build" \
            --notes "Built from ${{ github.sha }}. iPhone/iPad: in SideStore add the source https://github.com/${{ github.repository }}/releases/download/latest/sidestore.json (or install Trove.ipa with Sideloadly). Mac: unzip, then System Settings → Privacy & Security → Open Anyway the first time; after that it updates itself."
