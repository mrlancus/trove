# Builds the Mac and iPhone/iPad apps on GitHub's Macs (free for public repos), since there's no
# Apple Silicon Mac to run Xcode on. Download the apps from the run's Artifacts:
#   Trove-macOS  → unzip, then right-click Trove.app → Open (it isn't notarized)
#   Trove-iOS    → Trove.ipa; install with Sideloadly using your free Apple ID (redo every 7 days)
name: Apple apps

on:
  push:
    branches: [main]
    paths: ["App/**", "Packages/**", "extensions/browser/**", "scripts/ci-build-apps.sh", ".github/workflows/apps.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -E "macosx|iphoneos"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: TroveCore tests
        run: cd Packages/TroveCore && swift test 2>&1 | tail -5

      - name: Build apps
        id: build
        run: ./scripts/ci-build-apps.sh

      - name: Error report
        if: always()
        run: |
          {
            echo "## Build errors"
            for p in macos ios; do
              echo "### $p"; echo '```'; head -150 build/logs/$p-errors.txt 2>/dev/null || echo "(no log)"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # The logs also go to the ci-logs branch, so a cloud Claude session can read them with git.
      - name: Publish logs to the ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/ci && cp -R build/logs/. /tmp/ci/
          echo "${{ github.sha }} ${{ steps.build.outcome }}" > /tmp/ci/RESULT
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git fetch origin ci-logs || true
          git checkout --orphan ci-logs-new
          git rm -rfq . && git clean -fdxq -e build
          cp -R /tmp/ci/. . && git add -A && git commit -qm "Logs for ${{ github.sha }}"
          git push -f origin HEAD:ci-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Trove-macOS
          path: build/out/Trove-macOS.zip
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Trove-iOS
          path: build/out/Trove.ipa
          if-no-files-found: ignore
