# The paper catalogue (docs/CATALOGUE.md): every Monday, rebuild it from the exam boards' own public
# listings (new series appear without an app update; the apps fetch catalogue/ from this repo) and
# commit it if anything changed; then check a sample of its links. Links and facts only, no papers.
name: Catalogue

on:
  push:
    branches: [main]
    paths: ["catalogue/**", "scripts/catalogue/**", "scripts/check-catalogue.py", ".github/workflows/catalogue.yml"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild from the boards' listings
        run: python3 scripts/catalogue/build.py
      - name: Commit if changed
        run: |
          git add catalogue
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "trove-catalogue"
          git config user.email "trove-catalogue@users.noreply.github.com"
          git commit -m "Catalogue: weekly rebuild from the boards' listings"
          git push
  links:
    needs: [rebuild]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Check links (a sample of 400, and every spec's newest paper)
        run: python3 scripts/check-catalogue.py catalogue --sample 400
